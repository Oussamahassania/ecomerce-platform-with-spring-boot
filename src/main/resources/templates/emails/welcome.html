<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; background:#f4f4f4; padding: 20px;">
<div style="max-width:600px; margin:auto; background:white; border-radius:8px; padding:30px;">

    <h2 style="color:#2c3e50;">Welcome to EcommerceWeb! 🎉</h2>
    <p>Hi <strong th:text="${fullName}"></strong>,</p>
    <p>Thank you for registering. Please verify your email to activate your account.</p>

    <a th:href="${verificationUrl}"
       style="display:inline-block; padding:12px 24px; background:#3498db;
              color:white; border-radius:5px; text-decoration:none; margin:20px 0;">
        ✅ Verify My Email
    </a>

    <p style="color:#999; font-size:12px;">This link expires in 24 hours.</p>
    <p>If you didn't register, ignore this email.</p>
</div>
</body>
</html>
