<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; background:#f4f4f4; padding: 20px;">
<div style="max-width:600px; margin:auto; background:white; border-radius:8px; padding:30px;">

    <h2 style="color:#2c3e50;">Order Confirmed! 🛒</h2>
    <p>Hi <strong th:text="${fullName}"></strong>,</p>
    <p>Your order <strong th:text="'#' + ${orderId}"></strong> has been placed successfully.</p>

    <table style="width:100%; border-collapse:collapse; margin:20px 0;">
        <thead>
        <tr style="background:#3498db; color:white;">
            <th style="padding:10px; text-align:left;">Product ID</th>
            <th style="padding:10px; text-align:left;">Quantity</th>
            <th style="padding:10px; text-align:left;">Price</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}" style="border-bottom:1px solid #eee;">
            <td style="padding:10px;" th:text="${item.productId}"></td>
            <td style="padding:10px;" th:text="${item.quantity}"></td>
            <td style="padding:10px;" th:text="${item.price}"></td>
        </tr>
        </tbody>
    </table>

    <h3>Total: <span th:text="${totalAmount}"></span></h3>
    <p style="color:#999; font-size:12px;">Thank you for shopping with us!</p>
</div>
</body>
</html>
